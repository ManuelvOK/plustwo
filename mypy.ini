# Type checking of plustwo, run by make check. The layers the rule pass has
# reached get the strict sections below: every function annotated.
[mypy]
mypy_path = src
explicit_package_bases = True
python_version = 3.14
warn_redundant_casts = True
warn_unused_ignores = True

[mypy-plustwo.git.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-plustwo.config.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-plustwo.model.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-plustwo.diff.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-plustwo.review.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
